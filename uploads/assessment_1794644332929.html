:root{
  --ink:#1f2f3d; --mut:#4b5b66; --line:#d7dcd9; --acc:#2f6f8f; --warm:#b8503a;
  --ok:#27ae60; --bg:#f5f6f4; --bench:#f0f4f7; --bench-2:#e8eff2; --panel:#fff;
  --sidebar-w:clamp(260px,30vw,320px);
  --player-safe-top:64px;
  --bench-safe-top:70px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans Arabic','Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
#app{display:flex;flex-direction:row;width:100%;height:100vh;height:100dvh;overflow:hidden}
#app.panel-open #bench-stage{margin-right:min(var(--sidebar-w),88vw)}
#sidebar{position:fixed;inset-block:0;right:0;width:min(var(--sidebar-w),88vw);height:100%;
  background:var(--panel);border-inline-end:1px solid var(--line);box-shadow:0 0 24px rgba(31,47,61,.12);
  display:flex;flex-direction:column;z-index:30;transform:translateX(105%);visibility:hidden;
  transition:transform .24s ease,visibility .24s}
#sidebar.open{transform:translateX(0);visibility:visible}
#bench-stage{transition:margin .24s ease}
.sb-head{position:relative;padding:calc(var(--player-safe-top) + 12px) 20px 12px;flex:0 0 auto}
.collapse-tab{position:fixed;top:50%;right:min(var(--sidebar-w),88vw);transform:translateY(-50%);
  width:36px;height:56px;display:grid;place-items:center;padding:0;border:1px solid var(--line);
  border-right:0;border-radius:12px 0 0 12px;background:var(--panel);color:var(--acc);
  box-shadow:-4px 2px 12px rgba(31,47,61,.12);cursor:pointer}
.collapse-tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.collapse-tab:hover{background:#f3f8fa;color:#245a75}
.collapse-tab:focus-visible{outline:3px solid rgba(47,111,143,.3);outline-offset:2px}
.sb-head h1{margin:0 0 4px;font-size:18px;line-height:1.35}
.sb-head p{margin:0;font-size:13px;color:var(--mut);line-height:1.5}
.sb-scroll{direction:ltr;flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 20px;
  display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;scrollbar-width:thin;
  scrollbar-color:transparent transparent}
#sidebar.scrolling .sb-scroll{scrollbar-color:rgba(75,91,102,.6) transparent}
.sb-scroll::-webkit-scrollbar{width:7px}
.sb-scroll::-webkit-scrollbar-track{background:transparent}
.sb-scroll::-webkit-scrollbar-thumb{border-radius:99px;background:transparent}
#sidebar.scrolling .sb-scroll::-webkit-scrollbar-thumb{background:rgba(75,91,102,.6)}
.sb-foot{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 14px 12px;
  border-top:1px solid var(--line);background:var(--panel)}
.icon-btn{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;
  padding:0;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--mut);cursor:pointer}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
#rst:hover{border-color:var(--acc);background:#f3f8fa;color:var(--acc)}
#next{border-color:var(--acc);background:var(--acc);color:#fff;box-shadow:0 2px 5px rgba(47,111,143,.2)}
#next:hover{background:#245a75}
.icon-btn:focus-visible{outline:3px solid rgba(47,111,143,.3);outline-offset:2px}
.icon-btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.progress{flex:1 1 auto;min-width:0;display:grid;gap:5px}
.progress-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut)}
.progress-label strong{font-weight:700;color:var(--ink);direction:ltr}
.progress-track{height:4px;overflow:hidden;border-radius:99px;background:#e8edef}
.progress-fill{width:0;height:100%;border-radius:inherit;background:var(--acc);transition:width .2s ease}
#steps{direction:rtl;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
#steps li{display:grid;grid-template-columns:18px minmax(0,1fr);column-gap:10px;row-gap:4px;align-items:start;padding:6px 8px;margin-inline:-8px;
  border:1px solid transparent;border-radius:9px;font-size:13px;color:var(--mut);line-height:1.5;
  transition:background-color .18s,border-color .18s}
#steps li .box{width:18px;height:18px;border:1.5px solid var(--line);border-radius:5px;display:grid;place-items:center;font-size:12px;color:#fff;margin-top:2px}
#steps li.done{color:var(--ink)} #steps li.done .box{background:var(--ok);border-color:var(--ok)}
#steps li.cur{color:var(--ink);font-weight:600;background:#eaf4f8;border-color:#c9e0ea;
  box-shadow:inset -3px 0 0 var(--acc)}
#steps li.cur .box{border-color:var(--acc)}
.step-hint{grid-column:2;color:var(--warm);font-size:12px;font-weight:400}
.steps-done{padding:8px 0;color:var(--ok);font-size:14px;font-weight:700}
#bench-stage{flex:1 1 auto;min-width:0;height:100%;position:relative;background:var(--bench)}
#bench{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#tool-tooltip{position:absolute;z-index:5;max-width:min(180px,70%);padding:6px 10px;
  border:1px solid rgba(47,111,143,.28);border-radius:8px;background:rgba(255,255,255,.96);
  color:var(--ink);font-size:13px;font-weight:600;line-height:1.35;white-space:nowrap;
  box-shadow:0 3px 10px rgba(31,47,61,.14);pointer-events:none;opacity:0;visibility:hidden;
  transition:opacity .12s ease}
#tool-tooltip.visible{opacity:1;visibility:visible}
#desktop-warning{position:fixed;inset:0;z-index:1000;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:24px;padding:24px;background:#000;color:#fff;text-align:center;font-size:20px;line-height:1.7}
.device-icons{display:flex;align-items:center;justify-content:center;gap:36px}
.device-icon{width:72px;height:72px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.device-icon.computer{color:#39c46a}
.device-icon.phone{color:#ddd}
.phone-mark{stroke:#f04444;stroke-width:3}
 .panel-toggle{position:fixed;z-index:20;inset-block-start:50%;right:14px;transform:translateY(-50%);
  width:44px;height:44px;border:1px solid rgba(47,111,143,.25);border-radius:14px;background:#fff;
  color:var(--acc);box-shadow:0 4px 16px rgba(31,47,61,.16);display:grid;place-items:center;cursor:pointer}
.panel-toggle svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.panel-toggle[aria-expanded="true"]{opacity:0;visibility:hidden}
.panel-toggle:focus-visible{outline:3px solid rgba(47,111,143,.3);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  #sidebar,#bench-stage,#tool-tooltip{transition:none}
  .sb-scroll{scroll-behavior:auto}
}
@media (max-width:800px), (max-height:500px){
  #app,.panel-toggle{display:none}
  #desktop-warning{display:flex}
}
</style>
</head>
<body>
<div id="app" class="panel-open">
  <aside id="sidebar" class="open" aria-hidden="false">
    <div class="sb-head">
      <button id="collapse-panel" class="collapse-tab" type="button" aria-label="طي قائمة الخطوات" title="طي القائمة">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 18-6-6 6-6"/></svg>
      </button>
      <h1 id="exp-title"></h1><p id="exp-sub"></p>
    </div>
    <div class="sb-scroll">
      <ol id="steps" aria-label="تعليمات خطوات التجربة"></ol>
    </div>
    <footer class="sb-foot">
      <button id="rst" class="icon-btn" type="button" aria-label="إعادة التجربة" title="إعادة التجربة">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 6.4"/><path d="M3 4v7h7"/></svg>
      </button>
      <div class="progress" role="progressbar" aria-label="تقدم التجربة" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0">
        <div class="progress-label"><span>التقدم</span><strong id="progress-count">1 / 2</strong></div>
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <button id="next" class="icon-btn" type="button" aria-label="الخطوة التالية" title="الخطوة التالية">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
      </button>
    </footer>
  </aside>
  <main id="bench-stage"><canvas id="bench" tabindex="0"></canvas><div id="tool-tooltip" role="tooltip" aria-hidden="true"></div></main>
</div>
<div id="desktop-warning" role="status">
  <div class="device-icons" aria-hidden="true">
    <svg class="device-icon computer" viewBox="0 0 64 64">
      <rect x="7" y="8" width="50" height="39" rx="3"/><path d="M23 56h18m-9-9v9M15 56h34"/>
    </svg>
    <svg class="device-icon phone" viewBox="0 0 64 64">
      <rect x="20" y="5" width="24" height="54" rx="5"/><path d="M28 12h8m-4 38v1"/>
      <path class="phone-mark" d="m27 25 10 10m0-10L27 35"/>
    </svg>
  </div>
  <div>هذه المحاكاة مخصصة للشاشات الكبيرة. يرجى فتحها من جهاز حاسوب.</div>
</div>
<button id="open-panel" class="panel-toggle" type="button" aria-label="إظهار قائمة الخطوات"
  aria-controls="sidebar" aria-expanded="true" title="إظهار قائمة الخطوات">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
</button>

<script>
/* ===== DRAWKIT:BEGIN (v2) — مكتبة الرسم المتجهية الموحدة =====
   كل جهاز: Kit.<name>(g, x, y, s, opts)
   - (x, y) = نقطة الإمساك/الاستقرار (انظر الجدول في drawing-standards.md)
   - s = مقياس (استخدم U من القالب)
   - الضوء من أعلى اليسار دائماً. لا تعدّل الألوان خارج Kit.pal.
   ES5 فقط. يحتاج ctx.roundRect (polyfill موجود في القالب).               */
var Kit = (function () {
  var K = {}, TAU = Math.PI * 2;
  K.pal = { ink: '#1f2f3d', acc: '#2f6f8f', warm: '#b8503a', ok: '#27ae60',
            ivory: [236, 238, 235], graphite: [48, 60, 70], steel: [168, 178, 186],
            glassEdge: 'rgba(104,140,160,.95)' };

  /* ───── أدوات اللون ───── */
  function c255(v) { return Math.max(0, Math.min(255, Math.round(v))); }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function shade(c, k) { return [c255(c[0] * k), c255(c[1] * k), c255(c[2] * k)]; }
  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function lg(g, x0, y0, x1, y1, stops) {
    var gr = g.createLinearGradient(x0, y0, x1, y1);
    stops.forEach(function (s) { gr.addColorStop(s[0], s[1]); });
    return gr;
  }
  K.shade = shade; K.rgba = rgba;

  /* ───── ظل التماس: يثبّت الجهاز على الطاولة ───── */
  K.contactShadow = function (g, x, y, w, a) {
    g.save(); g.translate(x, y); g.scale(1, 0.2);
    var r = g.createRadialGradient(0, 0, 0, 0, 0, w / 2);
    r.addColorStop(0, 'rgba(31,47,61,' + (a || 0.3) + ')'); r.addColorStop(0.6, 'rgba(31,47,61,' + (a || 0.3) * 0.4 + ')');
    r.addColorStop(1, 'rgba(31,47,61,0)');
    g.fillStyle = r; g.beginPath(); g.arc(0, 0, w / 2, 0, TAU); g.fill(); g.restore();
  };

  /* ───── جزء معتم (معدن/بلاستيك) بتدرج أسطواني ───── */
  K.part = function (g, x, y, w, h, r, base, horizontalLight) {
    var vertical = horizontalLight === false;
    var gr = vertical
      ? lg(g, x, y, x, y + h, [[0, rgba(shade(base, 1.12), 1)], [0.25, rgba(shade(base, 1.04), 1)], [0.7, rgba(shade(base, 0.82), 1)], [1, rgba(shade(base, 0.62), 1)]])
      : lg(g, x, y, x + w, y, [[0, rgba(shade(base, 0.72), 1)], [0.18, rgba(shade(base, 1.14), 1)], [0.42, rgba(shade(base, 1.02), 1)], [0.8, rgba(shade(base, 0.8), 1)], [1, rgba(shade(base, 0.6), 1)]]);
    g.fillStyle = gr; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill();
    g.lineWidth = 1; g.strokeStyle = rgba(shade(base, 0.42), 0.75); g.stroke();
    if (h > 8 && w > 8) {                       // لمعة علوية دقيقة
      g.fillStyle = 'rgba(255,255,255,.22)'; g.beginPath();
      g.roundRect(x + 1.5, y + 1, w - 3, Math.min(3, h * 0.2), 1.5); g.fill();
    }
  };

  /* ───── زجاج: pathFn يبني المسار، وshine يحدد اتجاه اللمعة ───── */
  K.glass = function (g, pathFn, x, y, w, h, opts) {
    opts = opts || {};
    pathFn(g);
    g.fillStyle = lg(g, x, 0, x + w, 0, [[0, 'rgba(176,206,224,.50)'], [0.10, 'rgba(255,255,255,.60)'], [0.28, 'rgba(226,241,250,.16)'],
      [0.7, 'rgba(206,228,240,.10)'], [0.9, 'rgba(176,208,226,.34)'], [1, 'rgba(130,168,192,.55)']]);
    g.fill();
    g.lineWidth = 1.5; g.strokeStyle = K.pal.glassEdge; g.stroke();
    var shine = opts.shine || (w > h * 1.6 ? 'ellipse' : 'vertical');
    g.save(); pathFn(g); g.clip(); g.lineCap = 'round';
    g.strokeStyle = 'rgba(255,255,255,.75)';
    if (shine === 'flask') {
      g.lineWidth = Math.max(1.2, Math.min(3.2, w * 0.027));
      g.beginPath();
      g.moveTo(x + w * 0.37, y + h * 0.09);
      g.lineTo(x + w * 0.37, y + h * 0.33);
      g.lineTo(x + w * 0.12, y + h * 0.78);
      g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = Math.max(0.8, Math.min(1.6, w * 0.014));
      g.beginPath();
      g.moveTo(x + w * 0.65, y + h * 0.12);
      g.lineTo(x + w * 0.65, y + h * 0.33);
      g.lineTo(x + w * 0.88, y + h * 0.73);
      g.stroke();
    }
    if (shine === 'ellipse') {
      g.lineWidth = Math.max(0.8, Math.min(3, h * 0.07));
      g.beginPath(); g.ellipse(x + w * 0.5, y + h * 0.66, w * 0.39, h * 0.26, 0, Math.PI * 1.12, Math.PI * 1.48); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = Math.max(0.7, Math.min(1.8, h * 0.04));
      g.beginPath(); g.ellipse(x + w * 0.5, y + h * 0.66, w * 0.44, h * 0.3, 0, Math.PI * 1.62, Math.PI * 1.82); g.stroke();
    } else if (shine === 'horizontal') {
      g.lineWidth = Math.max(0.8, Math.min(2.4, h * 0.16));
      g.beginPath(); g.moveTo(x + w * 0.14, y + h * 0.28); g.lineTo(x + w * 0.72, y + h * 0.28); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = Math.max(0.6, Math.min(1.4, h * 0.09));
      g.beginPath(); g.moveTo(x + w * 0.34, y + h * 0.72); g.lineTo(x + w * 0.86, y + h * 0.72); g.stroke();
    } else if (shine === 'diagonal') {
      g.lineWidth = Math.max(0.8, Math.min(2.5, w * 0.035));
      g.beginPath(); g.moveTo(x + w * 0.18, y + h * 0.08); g.quadraticCurveTo(x + w * 0.36, y + h * 0.32, x + w * 0.48, y + h * 0.5); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = Math.max(0.6, Math.min(1.5, w * 0.02));
      g.beginPath(); g.moveTo(x + w * 0.84, y + h * 0.12); g.quadraticCurveTo(x + w * 0.66, y + h * 0.35, x + w * 0.52, y + h * 0.5); g.stroke();
    } else if (shine === 'vertical') {
      g.lineWidth = Math.max(0.7, Math.min(3, w * 0.045));
      g.beginPath(); g.moveTo(x + w * 0.17, y + h * 0.12); g.lineTo(x + w * 0.17, y + h * 0.7); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = Math.max(0.6, Math.min(1.8, w * 0.02));
      g.beginPath(); g.moveTo(x + w * 0.84, y + h * 0.2); g.lineTo(x + w * 0.84, y + h * 0.62); g.stroke();
    }
    g.restore();
  };

  /* ───── سائل داخل مسار (قص): أفتح في الوسط، أغمق عند الجدار، سطح بيضاوي + تقوّس ───── */
  K.liquid = function (g, pathFn, cx, w, topY, botY, color, surfRy) {
    var ry = surfRy === undefined ? 3.2 : surfRy;

  ctx.fillStyle = 'rgba(245,225,235,.95)'; ctx.fill(); ctx.strokeStyle = '#a0789a'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.restore();
}

function drawMicroscope() {
  Kit.microscope(ctx, MX, MY, U, { slide: S.onStage, specimen: 'rgba(230,200,220,.8)' });
  Kit.drawMicroscopeEye(ctx, eyeGeo());
}

function drawSlide(t) {
  if (S.onStage) return;
  ctx.save();
  Kit.slide(ctx, t.x, t.y, 1.1 * U, { specimen: S.specimen ? 'rgba(230,200,220,.85)' : null });
  if (S.stain) { ctx.fillStyle = 'rgba(200,120,170,.25)'; ctx.beginPath(); ctx.ellipse(t.x - 4 * U, t.y, 12 * U, 5 * U, 0, 0, Math.PI * 2); ctx.fill(); }
  if (S.cover) {
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.strokeStyle = 'rgba(120,150,168,.8)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(t.x - 22 * U, t.y - 9 * U, 44 * U, 18 * U, 2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawTool(t) {
  if (t.id === 'slide') return drawSlide(t);
  if (t.id === 'cover') {
    if (S.cover) return;
    ctx.save(); ctx.fillStyle = 'rgba(230,240,246,.75)'; ctx.strokeStyle = 'rgba(120,150,168,.85)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(t.x - 13 * U, t.y - 13 * U, 26 * U, 26 * U, 2); ctx.fill(); ctx.stroke(); ctx.restore();
    return;
  }
  if (t.id === 'scalpel') Kit.scalpel(ctx, t.x, t.y, 0.55 * U, {});
  if (t.id === 'forceps') Kit.forceps(ctx, t.x, t.y, 0.55 * U, { open: 0 });
  if (t.id === 'dropper') Kit.dropper(ctx, t.x, t.y, 0.5 * U, {});
}

/* ───────── مقطع الجذر في مجال الرؤية (رسم متجهي، إحداثيات 1200×1200) ───────── */
function hash(a, b) { var v = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return v - Math.floor(v); }
function isVessel(x, y) { return VESSELS.some(function (v) { return Math.hypot(x - v.x, y - v.y) < v.r + 14; }); }
function drawSpecimen(g, layout, crop) {
  var k = 2 * layout.r / crop.span;
  g.save();
  g.translate(layout.x, layout.y); g.scale(k, k);
  g.translate(-(crop.sx + crop.span / 2), -(crop.sy + crop.span / 2));
  g.fillStyle = '#f3e7ee'; g.fillRect(-200, -200, 1600, 1600);
  // خلايا البشرة والقشرة (برنشيمية) داخل الدائرة
  for (var i = -12; i <= 12; i++) for (var j = -12; j <= 12; j++) {
    var x = 600 + i * 46 + (hash(i, j) - 0.5) * 14, y = 600 + j * 46 + (hash(j, i + 5) - 0.5) * 14;
    if (Math.hypot(x - 600, y - 600) > 560 || isVessel(x, y)) continue;
    g.beginPath(); g.arc(x, y, 19 + hash(i + 2, j) * 3, 0, Math.PI * 2);
    g.fillStyle = '#f9f1f5'; g.fill(); g.strokeStyle = '#b07aa0'; g.lineWidth = 2; g.stroke();
  }
  // أوعية خشبية إضافية (داكنة الجدران) على حلقة حول المركز
  for (var n = 0; n < 26; n++) {
    var a = n / 26 * Math.PI * 2, rr = 250 + hash(n, 9) * 80;
    var vx = 600 + Math.cos(a) * rr, vy = 620 + Math.sin(a) * rr;
    if (Math.hypot(vx - 600, vy - 620) < 200) continue;
    drawVessel(g, vx, vy, 14 + hash(n, 3) * 14);
  }
  VESSELS.forEach(function (v) { drawVessel(g, v.x, v.y, v.r); });
  // أرقام الأوعية المكتشفة
  VESSELS.forEach(function (v) {
    if (!S.found[v.n]) return;
    g.save(); g.fillStyle = 'rgba(31,47,61,.85)'; g.beginPath(); g.arc(v.x, v.y - v.r - 26, 22, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.font = 'bold 26px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(v.n), v.x, v.y - v.r - 26); g.restore();
  });
  g.restore();
}
function drawVessel(g, x, y, r) {
  g.beginPath(); g.ellipse(x, y, r, r * 0.9, 0.3, 0, Math.PI * 2);
  g.fillStyle = '#f4f8f8'; g.fill(); g.strokeStyle = '#2c2f6b'; g.lineWidth = 9; g.stroke();
}

/* ───────── المجهر ───────── */
var micView = null;
function focusedNow() { return !!micView && Math.abs(micView.state.coarse - 0.55) < 0.05 && Math.abs(micView.state.fine) < 0.12; }
function toView(sx, sy, layout, crop) {
  var k = 2 * layout.r / crop.span;
  return [layout.x + (sx - (crop.sx + crop.span / 2)) * k, layout.y + (sy - (crop.sy + crop.span / 2)) * k];
}

/* ───────── الشريط الجانبي والتقدم ───────── */
function renderSidebar() {
  $('exp-title').textContent = T.title; $('exp-sub').textContent = T.sub;
  var done = stepIdx >= steps.length;
  $('progress-count').textContent = Math.min(stepIdx + 1, steps.length) + ' / ' + steps.length;
  $('progress-fill').style.width = (stepIdx / steps.length * 100) + '%';
  document.querySelector('.progress').setAttribute('aria-valuenow', String(stepIdx));
  $('next').disabled = done;
  var ol = $('steps'); ol.textContent = '';
  steps.forEach(function (s, i) {
    var li = document.createElement('li');
    li.className = i < stepIdx ? 'done' : (i === stepIdx ? 'cur' : '');
    var b = document.createElement('span'); b.className = 'box'; b.textContent = i < stepIdx ? '✓' : '';
    var tx = document.createElement('span'); tx.textContent = s.t;
    li.appendChild(b); li.appendChild(tx);
    if (i === stepIdx && !done && stepHint) { var h = document.createElement('span'); h.className = 'step-hint'; h.setAttribute('role', 'status'); h.textContent = stepHint; li.appendChild(h); }
    ol.appendChild(li);
  });
  if (done) { var st = document.createElement('li'); st.className = 'steps-done'; st.setAttribute('role', 'status'); st.textContent = T.done; ol.appendChild(st); }
  var cur = ol.querySelector('.cur'); if (cur) cur.scrollIntoView({ block: 'nearest' });
}
function hint(msg) { stepHint = msg || ''; renderSidebar(); }
function progress() {
  while (stepIdx < steps.length && steps[stepIdx].done()) { stepIdx++; stepHint = ''; }
  renderSidebar();
}

/* ───────── الأفعال ───────── */
function applyAction(id, target) {
  if (id === 'scalpel' && target === 'root') { if (S.cut) return T.wrong; S.cut = true; return ''; }
  if (id === 'forceps' && target === 'slice') { if (!S.cut) return T.needCut; if (S.lifted) return T.wrong; S.lifted = true; return ''; }
  if (id === 'forceps' && target === 'slide') {
    if (!S.lifted) return T.needLift;
    if (S.specimen) return T.hasSpec;
    S.specimen = true; return '';
  }
  if (id === 'dropper' && target === 'slide') { if (!S.specimen) return T.needSpec; if (S.stain) return T.hasStain; S.stain = true; return ''; }
  if (id === 'cover' && target === 'slide') { if (!S.stain) return T.needStain; if (S.cover) return T.hasCover; S.cover = true; return ''; }
  if (id === 'slide' && target === 'stage') { if (!S.cover) return T.needCover; S.onStage = true; return ''; }
  return T.wrong;
}
function sendHome(t) { t.anim = { fx: t.x, fy: t.y, t0: performance.now(), dur: 260 }; requestAnimationFrame(animTick); }
function animTick(now) {
  var busy = false;
  tools.forEach(function (t) {
    if (!t.anim) return;
    var k = Math.min(1, (now - t.anim.t0) / t.anim.dur), e = 1 - Math.pow(1 - k, 3);
    t.x = t.anim.fx + (t.home.x - t.anim.fx) * e; t.y = t.anim.fy + (t.home.y - t.anim.fy) * e;
    if (k >= 1) t.anim = null; else busy = true;
  });
  draw();
  if (busy) requestAnimationFrame(animTick);
}
function releaseTool(t) {
  var p = { x: t.x, y: t.y }, target = null;
  if (t.id === 'slide') { if (inRect(p, stageRect())) target = 'stage'; }
  else if (t.id === 'scalpel') { if (inRect(p, rootRect())) target = 'root'; }
  else if (inRect(p, sliceRect()) && S.cut && !S.lifted) target = 'slice';
  else if (inRect(p, slideRect())) target = 'slide';
  var msg = applyAction(t.id, target);
  var placed = (t.id === 'cover' && S.cover) || (t.id === 'slide' && S.onStage);
  if (!placed) sendHome(t);
  hint(msg); progress(); draw();
}
function openEye() {
  if (!S.onStage) { hint(T.needStage); return; }
  scene = 'eye'; S.viewed = true;
  cv.style.display = 'none'; micCv.style.display = 'block';
  micView.draw(); progress();
}
function closeEye() { scene = 'bench'; micCv.style.display = 'none'; cv.style.display = 'block'; draw(); }

/* ───────── الإدخال ───────── */
var tip = $('tool-tooltip');
function pt(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function showTip(name, p) { tip.textContent = name; tip.style.left = (p.x + 14) + 'px'; tip.style.top = (p.y + 14) + 'px'; tip.classList.add('visible'); tip.setAttribute('aria-hidden', 'false'); }
function hideTip() { tip.classList.remove('visible'); tip.setAttribute('aria-hidden', 'true'); }
function nameAt(p) {
  for (var i = tools.length - 1; i >= 0; i--) if (inTool(tools[i], p)) return T.names[tools[i].id];
  if (eyeHit(p)) return T.names.eye;
  if (inRect(p, rootRect())) return T.names.root;
  if (S.cut && !S.lifted && inRect(p, sliceRect())) return T.names.slice;
  if (inRect(p, microRect())) return T.names.mic;
  return '';
}
cv.addEventListener('pointerdown', function (e) {
  if (scene !== 'bench') return;
  var p = pt(e); hideTip();
  if (eyeHit(p) && S.onStage) { openEye(); return; }
  for (var i = tools.length - 1; i >= 0; i--) {
    var t = tools[i];
    if (inTool(t, p)) { t.anim = null; dragTool = t; dragOff = { x: t.x - p.x, y: t.y - p.y }; cv.setPointerCapture(e.pointerId); e.preventDefault(); draw(); return; }
  }
});
cv.addEventListener('pointermove', function (e) {
  var p = pt(e);
  if (dragTool) { dragTool.x = p.x + dragOff.x; dragTool.y = p.y + dragOff.y; draw(); return; }
  var name = scene === 'bench' ? nameAt(p) : '';
  if (name) showTip(name, p); else hideTip();
});
function endDrag() { if (!dragTool) return; var t = dragTool; dragTool = null; releaseTool(t); }
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('pointerleave', hideTip);

/* ───────── الشريط الجانبي: فتح/طي وإعادة ───────── */
var sidebar = $('sidebar'), app = $('app'), openPanel = $('open-panel'), collapsePanel = $('collapse-panel');
function setPanelOpen(isOpen) {
  sidebar.classList.toggle('open', isOpen); app.classList.toggle('panel-open', isOpen);
  sidebar.setAttribute('aria-hidden', String(!isOpen)); sidebar.inert = !isOpen;
  openPanel.setAttribute('aria-expanded', String(isOpen));
  resize();
  window.setTimeout(function () { (isOpen ? collapsePanel : openPanel).focus(); }, 0);
}
openPanel.addEventListener('click', function () { setPanelOpen(true); });
collapsePanel.addEventListener('click', function () { setPanelOpen(false); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sidebar.classList.contains('open')) setPanelOpen(false); });
$('next').addEventListener('click', function () {
  if (stepIdx >= steps.length) return;
  if (steps[stepIdx].done()) progress(); else hint(T.notReady);
});
$('rst').addEventListener('click', function () {
  S = freshState(); scene = 'bench'; stepIdx = 0; stepHint = ''; dragTool = null;
  micCv.style.display = 'none'; cv.style.display = 'block';
  micView.state.objective = 0; micView.state.rotation = 0; micView.state.coarse = 0.15; micView.state.fine = 0;
  micView.state.cx = 600; micView.state.cy = 600;
  tools.forEach(function (t) { t.anim = null; t.x = t.home.x; t.y = t.home.y; });
  renderSidebar(); draw();
});
window.addEventListener('resize', resize);

/* ───────── مجال الرؤية (قالب المجهر) ───────── */
micView = createMicroscopeView(micCv, {
  safeTop: 70,
  objectives: [4, 10, 15, 40],
  spans: [1120, 720, 500, 260],
  sampleName: 'مقطع عرضي في جذر السوسن',
  isActive: function () { return scene === 'eye'; },
  isFocused: function () { return focusedNow(); },
  drawSample: function (g, layout, crop) { drawSpecimen(g, layout, crop); },
  onIdentify: function (p, layout, crop) {
    if (!focusedNow()) { hint(T.focus); return; }
    var k = 2 * layout.r / crop.span;
    var sx = crop.sx + crop.span / 2 + (p.x - layout.x) / k;
    var sy = crop.sy + crop.span / 2 + (p.y - layout.y) / k;
    var hit = VESSELS.filter(function (v) { return Math.hypot(sx - v.x, sy - v.y) <= v.r * 1.6 + 8; })[0];
    if (!hit) { hint(T.miss); return; }
    if (S.found[hit.n]) { hint(''); return; }
    S.found[hit.n] = true; hint(T.found + hit.n); micView.draw(); progress();
  },
  onReturn: function () { closeEye(); },
  onChange: function () {}
});

renderSidebar();
resize();
})();
</script>
</body>
</html>
