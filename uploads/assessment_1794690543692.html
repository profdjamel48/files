<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تخمر محلول الخميرة باستعمال وسيط فوكسي و EXAO</title>
<style>
:root{
  --ink:#1f2f3d; --mut:#4b5b66; --line:#d7dcd9; --acc:#2f6f8f; --warm:#b8503a;
  --ok:#27ae60; --bg:#f5f6f4; --bench:#f0f4f7; --bench-2:#e8eff2; --panel:#fff;
  --sidebar-w:clamp(260px,30vw,320px);
  --player-safe-top:64px;
  --bench-safe-top:70px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans Arabic','Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
#app{display:flex;flex-direction:row;width:100%;height:100vh;height:100dvh;overflow:hidden}
#app.panel-open #bench-stage{margin-right:min(var(--sidebar-w),88vw)}
#sidebar{position:fixed;inset-block:0;right:0;width:min(var(--sidebar-w),88vw);height:100%;
  background:var(--panel);border-inline-end:1px solid var(--line);box-shadow:0 0 24px rgba(31,47,61,.12);
  display:flex;flex-direction:column;z-index:30;transform:translateX(105%);visibility:hidden;
  transition:transform .24s ease,visibility .24s}
#sidebar.open{transform:translateX(0);visibility:visible}
#bench-stage{transition:margin .24s ease}
.sb-head{position:relative;padding:calc(var(--player-safe-top) + 12px) 20px 12px;flex:0 0 auto}
.collapse-tab{position:fixed;top:50%;right:min(var(--sidebar-w),88vw);transform:translateY(-50%);
  width:36px;height:56px;display:grid;place-items:center;padding:0;border:1px solid var(--line);
  border-right:0;border-radius:12px 0 0 12px;background:var(--panel);color:var(--acc);
  box-shadow:-4px 2px 12px rgba(31,47,61,.12);cursor:pointer}
.collapse-tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.collapse-tab:hover{background:#f3f8fa;color:#245a75}
.collapse-tab:focus-visible{outline:3px solid rgba(47,111,143,.3);outline-offset:2px}
.sb-head h1{margin:0 0 4px;font-size:18px;line-height:1.35}
.sb-head p{margin:0;font-size:13px;color:var(--mut);line-height:1.5}
.sb-scroll{direction:ltr;flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 20px;
  display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;scrollbar-width:thin;
  scrollbar-color:transparent transparent}
#sidebar.scrolling .sb-scroll{scrollbar-color:rgba(75,91,102,.6) transparent}
.sb-scroll::-webkit-scrollbar{width:7px}
.sb-scroll::-webkit-scrollbar-track{background:transparent}
.sb-scroll::-webkit-scrollbar-thumb{border-radius:99px;background:transparent}
#sidebar.scrolling .sb-scroll::-webkit-scrollbar-thumb{background:rgba(75,91,102,.6)}
.sb-foot{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 14px 12px;
  border-top:1px solid var(--line);background:var(--panel)}
.icon-btn{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;
  padding:0;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--mut);cursor:pointer}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
#rst:hover{border-color:var(--acc);background:#f3f8fa;color:var(--acc)}
#next{border-color:var(--acc);background:var(--acc);color:#fff;box-shadow:0 2px 5px rgba(47,111,143,.2)}
#next:hover{background:#245a75}
.icon-btn:focus-visible{outline:3px solid rgba(47,111,143,.3);outline-offset:2px}
.icon-btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.progress{flex:1 1 auto;min-width:0;display:grid;gap:5px}
.progress-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut)}
.progress-label strong{font-weight:700;color:var(--ink);direction:ltr}
.progress-track{height:4px;overflow:hidden;border-radius:99px;background:#e8edef}
.progress-fill{width:0;height:100%;border-radius:inherit;background:var(--acc);transition:width .2s ease}
#steps{direction:rtl;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
#steps li{display:grid;grid-template-columns:18px minmax(0,1fr);column-gap:10px;row-gap:4px;align-items:start;padding:6px 8px;margin-inline:-8px;
  border:1px solid transparent;border-radius:9px;font-size:13px;color:var(--mut);line-height:1.5;
  transition:background-color .18s,border-color .18s}
#steps li .box{width:18px;height:18px;border:1.5px solid var(--line);border-radius:5px;display:grid;place-items:center;font-size:12px;color:#fff;margin-top:2px}
#steps li.done{color:var(--ink)} #steps li.done .box{background:var(--ok);border-color:var(--ok)}
#steps li.cur{color:var(--ink);font-weight:600;background:#eaf4f8;border-color:#c9e0ea;
  box-shadow:inset -3px 0 0 var(--acc)}
#steps li.cur .box{border-color:var(--acc)}
.step-hint{grid-column:2;color:var(--warm);font-size:12px;font-weight:400}
.steps-done{padding:8px 0;color:var(--ok);font-size:14px;font-weight:700}
#bench-stage{flex:1 1 auto;min-width:0;height:100%;position:relative;background:var(--bench)}
#bench{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#tool-tooltip{position:absolute;z-index:5;max-width:min(180px,70%);padding:6px 10px;
  border:1px solid rgba(47,111,143,.28);border-radius:8px;background:rgba(255,255,255,.96);
  color:var(--ink);font-size:13px;font-weight:600;line-height:1.35;white-space:nowrap;
  box-shadow:0 3px 10px rgba(31,47,61,.14);pointer-events:none;opacity:0;visibility:hidden;
  transition:opacity .12s ease}
#tool-tooltip.visible{opacity:1;visibility:visible}
#desktop-warning{position:fixed;inset:0;z-index:1000;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:24px;padding:24px;background:#000;color:#fff;text-align:center;font-size:20px;line-height:1.7}
.device-icons{display:flex;align-items:center;justify-content:center;gap:36px}
.device-icon{width:72px;height:72px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.device-icon.computer{color:#39c46a}
.device-icon.phone{color:#ddd}
.phone-mark{stroke:#f04444;stroke-width:3}
 .panel-toggle{position:fixed;z-index:20;inset-block-start:50%;right:14px;transform:translateY(-50%);
  width:44px;height:44px;border:1px solid rgba(47,111,143,.25);border-radius:14px;background:#fff;
  color:var(--acc);box-shadow:0 4px 16px rgba(31,47,61,.16);display:grid;place-items:center;cursor:pointer}
.panel-toggle svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.panel-toggle[aria-expanded="true"]{opacity:0;visibility:hidden}
.panel-toggle:focus-visible{outline:3px solid rgba(47,111,143,.3);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  #sidebar,#bench-stage,#tool-tooltip{transition:none}
  .sb-scroll{scroll-behavior:auto}
}
@media (max-width:800px), (max-height:500px){
  #app,.panel-toggle{display:none}
  #desktop-warning{display:flex}
}
.sb-scroll{position:relative}
.sb-note{direction:rtl;margin:4px 0 0;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--mut);line-height:1.7}
#exao{position:absolute;left:16px;top:14px;width:min(460px,46%);max-height:calc(100% - 28px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 20px rgba(31,47,61,.1);padding:12px 14px;z-index:3}
.exao-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.exao-head h2{margin:0;font-size:14px}
.dur{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.dur button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer;color:var(--mut)}
.dur button.on{border-color:var(--acc);color:#fff;background:var(--acc)}
.dur button:disabled{opacity:.5;cursor:default}
#readout{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px}
#readout table{width:100%;border-collapse:collapse;font-size:12.5px;text-align:center}
#readout th,#readout td{padding:6px 4px;border-bottom:1px solid #edf1f3}
#readout thead th{background:#f3f8fa;color:var(--ink);position:sticky;top:0;font-weight:700}
#readout tbody tr:last-child td{background:#eaf4f8;font-weight:700}
#readout .na{color:#aab4bb}
.exao-foot{font-size:12px;color:var(--mut);margin-top:6px;min-height:18px}
</style>
</head>
<body>
<div id="app" class="panel-open">
  <aside id="sidebar" class="open" aria-hidden="false">
    <div class="sb-head">
      <button id="collapse-panel" class="collapse-tab" type="button" aria-label="طي قائمة الخطوات" title="طي القائمة">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 18-6-6 6-6"/></svg>
      </button>
      <h1 id="exp-title"></h1><p id="exp-sub"></p>
    </div>
    <div class="sb-scroll">
      <ol id="steps" aria-label="تعليمات خطوات التجربة"></ol>
      <p class="sb-note">القيم المعروضة في المنحنيات والجدول توضيحية لتمثيل النموذج، وليست قياسات مخبرية.</p>
    </div>
    <footer class="sb-foot">
      <button id="rst" class="icon-btn" type="button" aria-label="إعادة التجربة" title="إعادة التجربة">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 6.4"/><path d="M3 4v7h7"/></svg>
      </button>
      <div class="progress" role="progressbar" aria-label="تقدم التجربة" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0">
        <div class="progress-label"><span>التقدم</span><strong id="progress-count">1 / 2</strong></div>
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <button id="next" class="icon-btn" type="button" aria-label="الخطوة التالية" title="الخطوة التالية">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
      </button>
    </footer>
  </aside>
  <main id="bench-stage"><canvas id="bench" tabindex="0"></canvas><div id="tool-tooltip" role="tooltip" aria-hidden="true"></div>
    <section id="exao" aria-label="الحاسوب EXAO">
      <div class="exao-head">
        <h2>الحاسوب (EXAO)</h2>
        <div class="dur" role="group" aria-label="مدة التسجيل">
          <span>المدة:</span>
          <button type="button" data-d="5">5 د</button>
          <button type="button" data-d="10" class="on">10 د</button>
          <button type="button" data-d="15">15 د</button>
        </div>
      </div>
      <div id="readout"></div>
      <div class="exao-foot" id="exao-foot"></div>
    </section>
  </main>
</div>
<div id="desktop-warning" role="status">
  <div class="device-icons" aria-hidden="true">
    <svg class="device-icon computer" viewBox="0 0 64 64">
      <rect x="7" y="8" width="50" height="39" rx="3"/><path d="M23 56h18m-9-9v9M15 56h34"/>
    </svg>
    <svg class="device-icon phone" viewBox="0 0 64 64">
      <rect x="20" y="5" width="24" height="54" rx="5"/><path d="M28 12h8m-4 38v1"/>
      <path class="phone-mark" d="m27 25 10 10m0-10L27 35"/>
    </svg>
  </div>
  <div>هذه المحاكاة مخصصة للشاشات الكبيرة. يرجى فتحها من جهاز حاسوب.</div>
</div>
<button id="open-panel" class="panel-toggle" type="button" aria-label="إظهار قائمة الخطوات"
  aria-controls="sidebar" aria-expanded="true" title="إظهار قائمة الخطوات">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
</button>

<script>
/* ===== DRAWKIT:BEGIN (v2) — مكتبة الرسم المتجهية الموحدة =====
   كل جهاز: Kit.<name>(g, x, y, s, opts)
   - (x, y) = نقطة الإمساك/الاستقرار (انظر الجدول في drawing-standards.md)
   - s = مقياس (استخدم U من القالب)
   - الضوء من أعلى اليسار دائماً. لا تعدّل الألوان خارج Kit.pal.
   ES5 فقط. يحتاج ctx.roundRect (polyfill موجود في القالب).               */
var Kit = (function () {
  var K = {}, TAU = Math.PI * 2;
  K.pal = { ink: '#1f2f3d', acc: '#2f6f8f', warm: '#b8503a', ok: '#27ae60',
            ivory: [236, 238, 235], graphite: [48, 60, 70], steel: [168, 178, 186],
            glassEdge: 'rgba(104,140,160,.95)' };

  /* ───── أدوات اللون ───── */
  function c255(v) { return Math.max(0, Math.min(255, Math.round(v))); }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function shade(c, k) { return [c255(c[0] * k), c255(c[1] * k), c255(c[2] * k)]; }
  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function lg(g, x0, y0, x1, y1, stops) {
    var gr = g.createLinearGradient(x0, y0, x1, y1);
    stops.forEach(function (s) { gr.addColorStop(s[0], s[1]); });
    return gr;
  }
  K.shade = shade; K.rgba = rgba;

  /* ───── ظل التماس: يثبّت الجهاز على الطاولة ───── */
  K.contactShadow = function (g, x, y, w, a) {
    g.save(); g.translate(x, y); g.scale(1, 0.2);
    var r = g.createRadialGradient(0, 0, 0, 0, 0, w / 2);
    r.addColorStop(0, 'rgba(31,47,61,' + (a || 0.3) + ')'); r.addColorStop(0.6, 'rgba(31,47,61,' + (a || 0.3) * 0.4 + ')');
    r.addColorStop(1, 'rgba(31,47,61,0)');
    g.fillStyle = r; g.beginPath(); g.arc(0, 0, w / 2, 0, TAU); g.fill(); g.restore();
  };

  /* ───── جزء معتم (معدن/بلاستيك) بتدرج أسطواني ───── */
  K.part = function (g, x, y, w, h, r, base, horizontalLight) {
    var vertical = horizontalLight === false;
    var gr = vertical
      ? lg(g, x, y, x, y + h, [[0, rgba(shade(base, 1.12), 1)], [0.25, rgba(shade(base, 1.04), 1)], [0.7, rgba(shade(base, 0.82), 1)], [1, rgba(shade(base, 0.62), 1)]])
      : lg(g, x, y, x + w, y, [[0, rgba(shade(base, 0.72), 1)], [0.18, rgba(shade(base, 1.14), 1)], [0.42, rgba(shade(base, 1.02), 1)], [0.8, rgba(shade(base, 0.8), 1)], [1, rgba(shade(base, 0.6), 1)]]);
    g.fillStyle = gr; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill();
    g.lineWidth = 1; g.strokeStyle = rgba(shade(base, 0.42), 0.75); g.stroke();
    if (h > 8 && w > 8) {                       // لمعة علوية دقيقة
      g.fillStyle = 'rgba(255,255,255,.22)'; g.beginPath();
      g.roundRect(x + 1.5, y + 1, w - 3, Math.min(3, h * 0.2), 1.5); g.fill();
    }
  };

  /* ───── زجاج: pathFn يبني المسار، وshine يحدد اتجاه اللمعة ───── */
  K.glass = function (g, pathFn, x, y, w, h, opts) {
    opts = opts || {};
    pathFn(g);
    g.fillStyle = lg(g, x, 0, x + w, 0, [[0, 'rgba(176,206,224,.50)'], [0.10, 'rgba(255,255,255,.60)'], [0.28, 'rgba(226,241,250,.16)'],
      [0.7, 'rgba(206,228,240,.10)'], [0.9, 'rgba(176,208,226,.34)'], [1, 'rgba(130,168,192,.55)']]);
    g.fill();
    g.lineWidth = 1.5; g.strokeStyle = K.pal.glassEdge; g.stroke();
    var shine = opts.shine || (w > h * 1.6 ? 'ellipse' : 'vertical');
    g.save(); pathFn(g); g.clip(); g.lineCap = 'round';
    g.strokeStyle = 'rgba(255,255,255,.75)';
    if (shine === 'flask') {
      g.lineWidth = Math.max(1.2, Math.min(3.2, w * 0.027));
      g.beginPath();
      g.moveTo(x + w * 0.37, y + h * 0.09);
      g.lineTo(x + w * 0.37, y + h * 0.33);
      g.lineTo(x + w * 0.12, y + h * 0.78);
      g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = Math.max(0.8, Math.min(1.6, w * 0.014));
      g.beginPath();
      g.moveTo(x + w * 0.65, y + h * 0.12);
      g.lineTo(x + w * 0.65, y + h * 0.33);
      g.lineTo(x + w * 0.88, y + h * 0.73);
      g.stroke();
    }
    if (shine === 'ellipse') {
      g.lineWidth = Math.max(0.8, Math.min(3, h * 0.07));
      g.beginPath(); g.ellipse(x + w * 0.5, y + h * 0.66, w * 0.39, h * 0.26, 0, Math.PI * 1.12, Math.PI * 1.48); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = Math.max(0.7, Math.min(1.8, h * 0.04));
      g.beginPath(); g.ellipse(x + w * 0.5, y + h * 0.66, w * 0.44, h * 0.3, 0, Math.PI * 1.62, Math.PI * 1.82); g.stroke();
    } else if (shine === 'horizontal') {
      g.lineWidth = Math.max(0.8, Math.min(2.4, h * 0.16));
      g.beginPath(); g.moveTo(x + w * 0.14, y + h * 0.28); g.lineTo(x + w * 0.72, y + h * 0.28); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = Math.max(0.6, Math.min(1.4, h * 0.09));
      g.beginPath(); g.moveTo(x + w * 0.34, y + h * 0.72); g.lineTo(x + w * 0.86, y + h * 0.72); g.stroke();
    } else if (shine === 'diagonal') {
      g.lineWidth = Math.max(0.8, Math.min(2.5, w * 0.035));
      g.beginPath(); g.moveTo(x + w * 0.18, y + h * 0.08); g.quadraticCurveTo(x + w * 0.36, y + h * 0.32, x + w * 0.48, y + h * 0.5); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = Math.max(0.6, Math.min(1.5, w * 0.02));
      g.beginPath(); g.moveTo(x + w * 0.84, y + h * 0.12); g.quadraticCurveTo(x + w * 0.66, y + h * 0.35, x + w * 0.52, y + h * 0.5); g.stroke();
    } else if (shine === 'vertical') {
      g.lineWidth = Math.max(0.7, Math.min(3, w * 0.045));
      g.beginPath(); g.moveTo(x + w * 0.17, y + h * 0.12); g.lineTo(x + w * 0.17, y + h * 0.7); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = Math.max(0.6, Math.min(1.8, w * 0.02));
      g.beginPath(); g.moveTo(x + w * 0.84, y + h * 0.2); g.lineTo(x + w * 0.84, y + h * 0.62); g.stroke();
    }
    g.restore();
  };

  /* ───── سائل داخل مسار (قص): أفتح في الوسط، أغمق عند الجدار، سطح بيضاوي + تقوّس ───── */
  K.liquid = function (g, pathFn, cx, w, topY, botY, color, surfRy) {
    var ry = surfRy === undefined ? 3.2 : surfRy;
    g.save(); pathFn(g); g.clip();
    g.fillStyle = lg(g, cx - w / 2, 0, cx + w / 2, 0, [[0, rgba(shade(color, 0.7), 0.92)], [0.25, rgba(shade(color, 1.1), 0.82)],
      [0.5, rgba(shade(color, 1.18), 0.76)], [0.8, rgba(shade(color, 0.92), 0.84)], [1, rgba(shade(color, 0.62), 0.94)]]);
    g.fillRect(cx - w / 2 - 2, topY, w + 4, botY - topY + 2);
    g.fillStyle = lg(g, 0, topY, 0, botY, [[0, 'rgba(255,255,255,.10)'], [1, 'rgba(0,0,0,.16)']]);   // تعتيم القاع
    g.fillRect(cx - w / 2 - 2, topY, w + 4, botY - topY + 2);
    g.fillStyle = rgba(shade(color, 1.3), 0.55);                                                    // السطح (Meniscus)
    g.beginPath(); g.ellipse(cx, topY, w / 2 - 1, ry, 0, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1;
    g.beginPath(); g.ellipse(cx, topY, w / 2 - 1.5, ry, 0, Math.PI * 0.05, Math.PI * 0.95); g.stroke();
    g.restore();
  };

  /* ═════════ الأدوات الزجاجية ═════════ */
  // origin = منتصف القاعدة على الطاولة. opts: level 0..1, color [r,g,b], marks
  K.beaker = function (g, cx, by, s, o) {
    o = o || {}; var w = 112, h = 134, x = -w / 2, y = -h, r = 12, color = o.color || [78, 150, 205];
    g.save(); g.translate(cx, by); g.scale(s, s);
    K.contactShadow(g, 0, 1, w * 1.05, 0.32);

var stirOn = false, dur = 10, durChosen = false, run = null;

// القيم التوضيحية للنموذج اللاهوائي في وسط مغلق

function startRun() {

var STEPS = [

  { t: 'أدخل المسابير الثلاثة في محلول الخميرة.',

    wrong: 'لم تُدخل المسابير الثلاثة بعد. أدخلها في المفاعل ثم أعد المحاولة.',

function scrollCurrentIntoView() {

/* ───────── 4. التخطيط والأبعاد ───────── */
function makeLayer(w, h, dpr) {
  var c = document.createElement('canvas');
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  var g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { c: c, g: g };
}

function resize() {
  var r = stage.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  SAFE_TOP = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bench-safe-top')) || 70;
  S = clamp(Math.min(W / 1000, (H - SAFE_TOP) / 560), 0.55, 1.25);
  var bg = makeLayer(W, H, DPR);
  var edge = Math.max(SAFE_TOP, H * 0.72);
  var ratio = clamp((edge - SAFE_TOP) / Math.max(1, H - SAFE_TOP), 0, 1);
  TABLE_Y = Kit.bench(bg.g, W, H, SAFE_TOP, ratio);
  layout();
  drawShelf(bg.g);
  layers.bg = bg;
}

function layout() {
  // المفاعل في منتصف الطاولة بعيداً عن لوحة EXAO
  VESSEL.fx = clamp(Math.max(W * 0.54, exao.offsetLeft + exao.offsetWidth + 100 * S), 0, W * 0.72);
  BASE = TABLE_Y + 50 * S;
  VESSEL.y0 = BASE;
  var fxBox = Math.min(W * 0.86, W - 70 * S);
  FOXY = { w: 210 * S, h: 116 * S, x: fxBox - 105 * S, y: TABLE_Y + 20 * S };
  // رف جداري تستقر عليه المسابير
  SHELF = { x0: W * 0.62, x1: W * 0.94, y: Math.max(SAFE_TOP + 150 * S, TABLE_Y - 250 * S) };
  probes.forEach(function (p, i) {
    p.hx = SHELF.x0 + (SHELF.x1 - SHELF.x0) * (i + 0.5) / 3;
    p.hy = SHELF.y;
    if (!p.inFlask && !(dragging && dragging.p === p)) { p.x = p.hx; p.y = p.hy; }
  });
}

function drawShelf(g) {
  var s = S, x0 = SHELF.x0, x1 = SHELF.x1, y = SHELF.y;
  g.save();
  g.fillStyle = '#9aa6aa';
  [x0 + 30 * s, x1 - 30 * s].forEach(function (sx) { g.fillRect(sx - 2 * s, y + 12 * s, 4 * s, 26 * s); });
  Kit.part(g, x0 - 10 * s, y, x1 - x0 + 20 * s, 12 * s, 4 * s, [160, 132, 98], false);
  Kit.part(g, x0 - 6 * s, y, x1 - x0 + 12 * s, 3 * s, 2 * s, [193, 167, 130], false);
  g.restore();
}

/* ───────── 5. مواضع الأدوات والأهداف ───────── */
function portPos(type) {
  var i = ORDER.indexOf(type);
  return { x: FOXY.x + (46 + i * 68) * S, y: FOXY.y + 40 * S };
}
function probeTarget(type) {
  return { x: VESSEL.fx + P[type].off * S, y: VESSEL.y0 - 30 * S };
}
function probePos(p) {
  if (dragging && dragging.p === p) return { x: p.x, y: p.y };
  return p.inFlask ? probeTarget(p.type) : { x: p.x, y: p.y };
}
function probeAt(pt) {
  for (var i = probes.length - 1; i >= 0; i--) {
    var pos = probePos(probes[i]);
    if (pt.x >= pos.x - 22 * S && pt.x <= pos.x + 22 * S && pt.y >= pos.y - 84 * S && pt.y <= pos.y + 8 * S) return probes[i];
  }
  return null;
}
function onStirrer(pt) {
  return pt.x >= VESSEL.fx - 95 * S && pt.x <= VESSEL.fx + 95 * S && pt.y >= BASE - 6 * S && pt.y <= BASE + 22 * S;
}

/* ───────── 6. الرسم ───────── */
function drawStirrer(now) {
  var g = ctx, s = S, fx = VESSEL.fx, top = BASE;
  g.save();
  var body = g.createLinearGradient(0, top, 0, top + 18 * s);
  body.addColorStop(0, '#9aa7b0');
  body.addColorStop(1, '#5f6d77');
  g.beginPath();
  g.roundRect(fx - 90 * s, top, 180 * s, 18 * s, 4 * s);
  g.fillStyle = body; g.fill();
  g.strokeStyle = '#3f4b54'; g.lineWidth = 1; g.stroke();
  g.beginPath(); g.arc(fx + 66 * s, top + 9 * s, 6 * s, 0, Math.PI * 2);
  g.fillStyle = '#e6ecf0'; g.fill();
  g.beginPath(); g.arc(fx - 66 * s, top + 9 * s, 3.5 * s, 0, Math.PI * 2);
  g.fillStyle = stirOn ? '#39c46a' : '#2b353d'; g.fill();
  g.restore();
}

function drawBioreactor(now) {
  var g = ctx, s = S, x = VESSEL.fx, y0 = VESSEL.y0;
  var nt = y0 - 100 * s, hw = 70 * s, r = 30 * s;
  function body() {
    g.beginPath();
    g.moveTo(x - hw, nt);
    g.lineTo(x - hw, y0 - r);
    g.arcTo(x - hw, y0, x - hw + r, y0, r);
    g.lineTo(x + hw - r, y0);
    g.arcTo(x + hw, y0, x + hw, y0 - r, r);
    g.lineTo(x + hw, nt);
    g.closePath();
  }
  g.save();
  body();
  g.fillStyle = 'rgba(225,240,247,.35)';
  g.fill();
  g.save();
  body();
  g.clip();
  // محلول الخميرة
  g.fillStyle = '#e4c98f';
  g.fillRect(x - hw, y0 - 72 * s, 2 * hw, 72 * s);
  // فقاعات تتزايد مع ثاني أكسيد الكربون
  var c = vals(run ? run.t : 0).co2;
  var n = Math.min(26, Math.floor(Math.max(0, c - 0.04) * 6));
  for (var i = 0; i < n; i++) {
    var seed = ((i * 97 + 13) % 100) / 100;
    var bx = x + (seed - 0.5) * 110 * s + Math.sin(now / 700 + i) * 2 * s;
    var by = y0 - 6 * s - ((now / 40 + i * 37) % 60) * s;
    g.beginPath();
    g.arc(bx, by, (2 + seed * 2) * s, 0, Math.PI * 2);
    g.fillStyle = 'rgba(255,255,255,.7)';
    g.fill();
  }
  g.restore();
  body();
  g.strokeStyle = 'rgba(90,120,140,.85)';
  g.lineWidth = 2 * s;
  g.stroke();
  // غطاء المفاعل مع فتحات للمسابير
  g.beginPath();
  g.roundRect(x - 84 * s, nt - 14 * s, 168 * s, 14 * s, 4 * s);
  var lid = g.createLinearGradient(0, nt - 14 * s, 0, nt);
  lid.addColorStop(0, '#c9d3da');
  lid.addColorStop(1, '#8e9ca6');
  g.fillStyle = lid;
  g.fill();
  g.strokeStyle = '#5f6d77';
  g.lineWidth = 1.2 * s;
  g.stroke();
  ORDER.forEach(function (t) {
    g.beginPath();
    g.arc(x + P[t].off * s, nt - 7 * s, 5 * s, 0, Math.PI * 2);
    g.fillStyle = '#3f4b54';
    g.fill();
  });
  // المقلّب العلوي: عمود ومروحة تدور عند تشغيل المخلاط
  var sx = x + 50 * s, by2 = y0 - 22 * s;
  g.beginPath();
  g.rect(sx - 2.5 * s, nt - 14 * s, 5 * s, by2 - (nt - 14 * s));
  g.fillStyle = '#c3ccd3';
  g.fill();
  var a = stirOn ? now / 120 : 0;
  g.save();
  g.translate(sx, by2);
  g.scale(Math.cos(a), 1);
  g.beginPath();
  g.roundRect(-20 * s, -3 * s, 40 * s, 6 * s, 3 * s);
  g.fillStyle = '#f2f2f2';
  g.fill();
  g.restore();
  // تسمية
  g.fillStyle = '#1f2f3d';
  g.font = Math.round(14 * s) + 'px ' + FONT;
  g.textAlign = 'center';
  g.fillText(TXT.vessel, x, y0 + 40 * s);
  g.restore();
}

function drawFoxy() {
  var g = ctx, s = S, x = FOXY.x, y = FOXY.y, w = FOXY.w, h = FOXY.h;
  g.save();
  var grad = g.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, '#3d5366');
  grad.addColorStop(1, '#22313d');
  g.beginPath(); g.roundRect(x, y, w, h, 14 * s);
  g.fillStyle = grad; g.fill();
  g.strokeStyle = '#15202a'; g.lineWidth = 1.5 * s; g.stroke();
  g.fillStyle = '#e8f1f6';
  g.font = Math.round(13 * s) + 'px ' + FONT;
  g.textAlign = 'center';
  g.fillText('وسيط فوكسي', x + w / 2, y + 18 * s);
  g.beginPath(); g.arc(x + w - 18 * s, y + 16 * s, 4 * s, 0, Math.PI * 2);
  g.fillStyle = anyInFlask() ? '#39c46a' : '#6b7b86'; g.fill();
  ORDER.forEach(function (t) {
    var pp = portPos(t);
    g.beginPath(); g.arc(pp.x, pp.y, 9 * s, 0, Math.PI * 2);
    g.fillStyle = '#101820'; g.fill();
    g.strokeStyle = P[t].col; g.lineWidth = 2 * s; g.stroke();
    g.fillStyle = '#e8f1f6';
    g.font = Math.round(12 * s) + 'px ' + FONT;
    g.textAlign = 'center';
    g.fillText(P[t].label, pp.x, y + h - 22 * s);
  });
  g.restore();
}

function drawCable(p, pos) {
  var s = S, sx = pos.x, sy = pos.y - 82 * s;
  var pp = portPos(p.type);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.bezierCurveTo(sx, sy - 60 * s, pp.x, pp.y + 90 * s, pp.x, pp.y);
  ctx.strokeStyle = '#5b6b76'; ctx.lineWidth = 2 * s; ctx.stroke();
  ctx.restore();
}

function drawProbe(p) {
  var pos = probePos(p), s = S, x = pos.x, y = pos.y, c = P[p.type].col;
  ctx.save();
  if (hover === p) {
    ctx.beginPath();
    ctx.arc(x, y - 40 * s, 36 * s, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(47,111,143,.6)';
    ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.fillStyle = '#c9d2d8';
  ctx.fillRect(x - 2.5 * s, y - 38 * s, 5 * s, 38 * s);
  ctx.beginPath(); ctx.ellipse(x, y, 3.5 * s, 4.5 * s, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#8a98a2'; ctx.fill();
  ctx.beginPath(); ctx.roundRect(x - 10 * s, y - 80 * s, 20 * s, 44 * s, 6 * s);
  ctx.fillStyle = '#f7f9fa'; ctx.fill();
  ctx.strokeStyle = 'rgba(31,47,61,.35)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.roundRect(x - 10 * s, y - 80 * s, 20 * s, 14 * s, 6 * s);
  ctx.fillStyle = c; ctx.fill();
  ctx.restore();
}

/* ───────── 7. جدول القياسات ───────── */
function renderTable() {
  var tc = run ? run.t : 0, rows = [];
  for (var k = 0; k <= dur * 2; k++) { var m = k / 2; if (m <= tc + 1e-9) rows.push(m); }
  var cell = function (type, v, d) {
    return isOn(type) ? '<td>' + v.toFixed(d) + '</td>' : '<td class="na">—</td>';
  };
  var html = '<table><thead><tr><th>الزمن (د)</th><th>O₂ %</th><th>CO₂ %</th><th>الإيثانول g/L</th></tr></thead><tbody>';
  rows.forEach(function (m) {
    var v = vals(m);
    html += '<tr><td>' + m.toFixed(1) + '</td>' +
      cell('o2', v.o2, 1) + cell('co2', v.co2, 2) + cell('eth', v.eth, 2) + '</tr>';
  });
  html += '</tbody></table>';
  if (html !== lastTable) { lastTable = html; $('readout').innerHTML = html; }
}

/* ───────── 8. حلقة الرسم ───────── */
function frame(now) {
  if (run && run.running) {
    run.t += Math.max(0, now - run.last) / 1000 * dur / 8;
    run.last = now;
    if (run.t >= dur) {
      run.t = dur; run.running = false; run.done = true;
      syncCompleted(); renderSidebar();
    }
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (layers.bg) ctx.drawImage(layers.bg.c, 0, 0, W, H);
  drawStirrer(now);
  drawBioreactor(now);
  drawFoxy();
  probes.forEach(function (p) { drawCable(p, probePos(p)); });
  probes.forEach(function (p) { if (!dragging || dragging.p !== p) drawProbe(p); });
  if (dragging) drawProbe(dragging.p);
  renderTable();
  updateFoot();
  requestAnimationFrame(frame);
}

/* ───────── 9. التلميحات والسحب (مؤشر واحد) ───────── */
function showTip(pt, item) {
  if (!item) {
    tip.classList.remove('visible');
    tip.setAttribute('aria-hidden', 'true');
    return;
  }
  tip.textContent = item.name;
  tip.setAttribute('aria-hidden', 'false');
  tip.classList.add('visible');
  tip.style.left = Math.min(W - 220, pt.x + 14) + 'px';
  tip.style.top = Math.max(8, pt.y - 40) + 'px';
}
function hoverItemAt(pt) {
  var q = probeAt(pt);
  if (q) return { name: P[q.type].name };
  if (onStirrer(pt)) return { name: TXT.stirrer };
  return null;
}
function pt(e) {
  var r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

cv.addEventListener('pointerdown', function (e) {
  if (run) return;                       // أثناء التسجيل وبعده لا تغيير في الإعداد
  var p = pt(e);
  var q = probeAt(p);
  if (q) {
    var pos = probePos(q);
    dragging = { p: q, pid: e.pointerId };
    q.inFlask = false;
    dragOff.x = p.x - pos.x; dragOff.y = p.y - pos.y;
    q.x = pos.x; q.y = pos.y;
    cv.setPointerCapture(e.pointerId);
    showTip(p, null);
    renderSidebar();
    return;
  }
  if (onStirrer(p)) {
    stirOn = !stirOn;
    showTip(p, null);
    renderSidebar();
  }
});

cv.addEventListener('pointermove', function (e) {
  var p = pt(e);
  if (dragging && dragging.pid === e.pointerId) {
    dragging.p.x = clamp(p.x - dragOff.x, 10, W - 10);
    dragging.p.y = clamp(p.y - dragOff.y, SAFE_TOP, H - 6);
    return;
  }
  hover = probeAt(p);
  if (e.pointerType !== 'touch') showTip(p, hoverItemAt(p));
  cv.style.cursor = (hover || onStirrer(p)) ? 'pointer' : 'default';
});

function endDrag(e, cancel) {
  if (!dragging || dragging.pid !== e.pointerId) return;
  var q = dragging.p;
  dragging = null;
  try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
  var tgt = probeTarget(q.type);
  var inside = !cancel && Math.hypot(q.x - tgt.x, q.y - tgt.y) < 45 * S;
  q.inFlask = inside;
  if (!inside) { q.x = q.hx; q.y = q.hy; }
  renderSidebar();
}
cv.addEventListener('pointerup', function (e) { endDrag(e, false); });
cv.addEventListener('pointercancel', function (e) { endDrag(e, true); });
cv.addEventListener('pointerleave', function () {
  if (!dragging) { hover = null; showTip(null, null); }
});

/* ───────── 10. المدة والأزرار ───────── */
document.querySelectorAll('.dur button').forEach(function (b) {
  b.addEventListener('click', function () {
    if (run) return;
    dur = Number(b.getAttribute('data-d'));
    durChosen = true;
    renderSidebar();
  });
});

function resetAll() {
  stirOn = false; dur = 10; durChosen = false; run = null;
  dragging = null; hover = null; msg = ''; lastTable = '';
  completed = [false, false, false, false];
  probes.forEach(function (p) { p.inFlask = false; p.x = p.hx; p.y = p.hy; });
  showTip(null, null);
  renderSidebar();
}
$('rst').addEventListener('click', resetAll);
$('next').addEventListener('click', nextStep);

/* ───────── 11. طي الشريط الجانبي وإظهاره ───────── */
var sidebar = $('sidebar'), app = $('app'), openPanel = $('open-panel'), collapsePanel = $('collapse-panel');
function setPanelOpen(isOpen) {
  sidebar.classList.toggle('open', isOpen);
  app.classList.toggle('panel-open', isOpen);
  sidebar.setAttribute('aria-hidden', String(!isOpen));
  sidebar.inert = !isOpen;
  openPanel.setAttribute('aria-expanded', String(isOpen));
  resize();
  window.setTimeout(function () { (isOpen ? collapsePanel : openPanel).focus(); }, 0);
}
openPanel.addEventListener('click', function () { setPanelOpen(true); });
collapsePanel.addEventListener('click', function () { setPanelOpen(false); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && sidebar.classList.contains('open')) setPanelOpen(false);
});

/* ───────── 12. الإقلاع ───────── */
if ('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);
else window.addEventListener('resize', resize);
resize();
renderSidebar();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
